name: Convert data CSVs
on:
  push:
    branches: [main]
    paths: ['data-src/*.csv']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@39370e3970a6d0505907c07dd2336c147af158f7 # v4.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Convert timetable + menu
        run: |
          if [ -f data-src/timetable.csv ]; then npx tsx scripts/timetable-csv-to-json.ts data-src/timetable.csv public/data/timetable.json; fi
          if [ -f data-src/menu.csv ]; then npx tsx scripts/menu-csv-to-json.ts data-src/menu.csv public/data/menu.json; fi
      - run: npm run validate:data
      - name: Commit converted JSON
        run: |
          if [ -n "$(git status --porcelain public/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/*.json
            git commit -m "chore(data): convert CSVs [skip ci]"
            git push
          fi
