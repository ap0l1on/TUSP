name: Prune old data
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@39370e3970a6d0505907c07dd2336c147af158f7 # v4.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/prune.ts
      - run: npm run validate:data
      - name: Commit pruned JSON
        run: |
          if [ -n "$(git status --porcelain public/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/changes.json public/data/announcements.json
            git commit -m "chore(data): prune old entries [skip ci]"
            git push
          fi
